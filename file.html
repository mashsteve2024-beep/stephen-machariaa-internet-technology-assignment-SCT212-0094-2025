<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Fill in the Form</h1>

        <form action="">
            <label for="name">Enter your name</label><br>
            <input type="text" id="name" placeholder="eg. Stephen" required><br><br>

            <label for="regno">Enter your Registration Number</label><br>
            <input type="text" id="regno" placeholder="SCT212-0094/2025" required><br><br>

            <label for="age">Enter Your Age</label><br>
            <input type="number" id="age" required><br><br><br>

            <button id="btn">Submit</button>
            <button type="reset" id="resetBtn">Reset</button>

            <p id="statusMessage"></p>
        </form>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
